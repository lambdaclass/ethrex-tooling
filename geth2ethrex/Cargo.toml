[package]
name = "geth2ethrex"
version.workspace = true
edition.workspace = true
authors.workspace = true
documentation.workspace = true
license.workspace = true

[dependencies]
ethrex-common = { git = "https://github.com/lambdaclass/ethrex", tag = "v28.0.0" }
ethrex-storage = { git = "https://github.com/lambdaclass/ethrex", tag = "v28.0.0", features = [
    "rocksdb",
] }
ethrex-rlp = { git = "https://github.com/lambdaclass/ethrex", tag = "v28.0.0" }
ethrex-trie = { git = "https://github.com/lambdaclass/ethrex", tag = "v28.0.0" }
ethrex-config = { git = "https://github.com/lambdaclass/ethrex", tag = "v28.0.0" }

anyhow.version = "1.0.100"
clap = { workspace = true, features = ["string"] }
clap_complete.workspace = true
eyre.workspace = true
rocksdb.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
snap.workspace = true
